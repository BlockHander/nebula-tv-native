name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  APK_PATH: android/app/build/outputs/apk/release/app-release.apk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xms256m -Xmx2048m" --max-workers=2
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ github.event.inputs.version }}" && VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp "${{ env.APK_PATH }}" "NebulaTV-v${{ steps.version.outputs.version }}.apk"

      - name: Get APK SHA256
        id: apk_hash
        run: |
          echo "sha256=$(sha256sum NebulaTV-v${{ steps.version.outputs.version }}.apk | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Generate short URL for Downloader app
        id: short_url
        run: |
          APK_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/NebulaTV-v${{ steps.version.outputs.version }}.apk"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          # Try is.gd API to generate a short URL
          SHORT_URL=$(curl -s "https://is.gd/create.php?format=simple&url=$(echo -n "$APK_URL" | jq -sRr @uri)" 2>/dev/null || echo "")
          if [ -n "$SHORT_URL" ] && echo "$SHORT_URL" | grep -q "^https://is.gd/"; then
            echo "short_url=$SHORT_URL" >> $GITHUB_OUTPUT
            echo "Generated short URL: $SHORT_URL"
          else
            echo "short_url=Short URL not generated — create one at https://is.gd or https://tinyurl.com" >> $GITHUB_OUTPUT
            echo "is.gd short URL generation failed (response: $SHORT_URL)"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NebulaTV v${{ steps.version.outputs.version }}
          body: |
            ## NebulaTV v${{ steps.version.outputs.version }}

            Native Android TV app for [Nebula.tv](https://nebula.tv)

            ### 📦 APK Download

            **Direct download:**
            [`NebulaTV-v${{ steps.version.outputs.version }}.apk`](${{ steps.short_url.outputs.apk_url }})

            **Short URL (for Downloader app):**
            > `${{ steps.short_url.outputs.short_url }}`

            **SHA-256:** `${{ steps.apk_hash.outputs.sha256 }}`

            **File size:** ${{ env.APK_SIZE || '~69 MB' }}

            ---

            ## 🚀 Easy Installation on Android TV / Fire TV

            ### Method 1: Downloader App (Easiest)

            The **[Downloader](https://play.google.com/store/apps/details?id=com.esaba.downloader)** app is a free file downloader and installer available on the Play Store and Amazon Appstore. Use it to install Nebula TV directly on your device.

            **Steps:**
            1. Install *Downloader* from the **Google Play Store** or **Amazon Appstore**
            2. Open the Downloader app
            3. Enter the short URL in the address bar:
               > **`${{ steps.short_url.outputs.short_url }}**`
            4. Tap **Go** — the APK will download automatically
            5. Tap **Install** when prompted
            6. Launch **Nebula TV** from your apps row

            > 💡 **Tip:** Pin the Downloader app to your favorites for future updates.

            ### Method 2: AFTVnews Downloader Code

            Visit **[aftv.news](https://aftv.news)** and enter this full APK URL to generate a **5-digit numeric code** for the Downloader app:

            ```
            ${{ steps.short_url.outputs.apk_url }}
            ```

            Once generated, you can enter the code directly into the Downloader app without typing the full URL.

            ### Method 3: ADB Sideload (Advanced)

            ```bash
            # Download the APK on your computer, then:
            adb install NebulaTV-v${{ steps.version.outputs.version }}.apk
            ```

            ---

            ### 🔧 Build Details
            | Component | Version |
            |-----------|---------|
            | App Version | ${{ steps.version.outputs.version }} |
            | Expo SDK | 52 |
            | React Native | 0.76.9 |
            | Target SDK | 34 |

            > ⚠️ **Note:** Release builds use the Android debug keystore. For public distribution, generate a production signing key and configure `signingConfigs.release` in `android/app/build.gradle`.

            Built with ❤️ using Expo + React Native
          files: |
            NebulaTV-v*.apk
          draft: false
          prerelease: false
